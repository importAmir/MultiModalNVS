[project]
name = "gen3c"
version = "0.1.0"
description = "GEN3C - 3D-Informed World-Consistent Video Generation with Precise Camera Control"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.4"

[pypi-dependencies]
attrs = "==25.1.0"
better-profanity = "==0.7.0"
boto3 = "==1.35.99"
decord = "==0.6.0"
diffusers = "==0.32.2"
einops = "==0.8.1"
huggingface-hub = "==0.29.2"
hydra-core = "==1.3.2"
imageio = {extras = ["pyav", "ffmpeg"], version = "==2.37.0"}
iopath = "==0.1.10"
ipdb = "==0.13.13"
loguru = "==0.7.2"
mediapy = "==1.2.2"
megatron-core = "==0.10.0"
nltk = "==3.9.1"
numpy = "==1.26.4"
nvidia-ml-py = "==12.535.133"
omegaconf = "==2.3.0"
opencv-python = "==4.10.0.84"
pandas = "==2.2.3"
peft = "==0.14.0"
pillow = "==11.1.0"
protobuf = "==4.25.3"
pynvml = "==12.0.0"
pyyaml = "==6.0.2"
retinaface-py = "==0.0.2"
safetensors = "==0.5.3"
scikit-image = "==0.25.2"
scipy = "*"
sentencepiece = "==0.2.0"
# Video quality metrics dependencies
pytorch-msssim = "*"
lpips = "*"
torchmetrics = {extras = ["image"], version = "*"}
cd-fvd = "*"
# setuptools = "==76.0.0"
termcolor = "==2.5.0"
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.21.0", index = "https://download.pytorch.org/whl/cu124" }
tqdm = "==4.66.5"
transformers = "==4.49.0"
warp-lang = "==1.7.2"
openexr = "==3.3.5"
# transformer-engine = {extras = ["pytorch"], version = "==1.12.0"}
xformers = "*"
dvc = {extras = ["azure"], version = "*"}
# gui dependencies
commentjson = "*"
pyquaternion = "*"
pyexr = "*"
pybind11 = "*"
httpx = "*"
fastapi = {extras = ["standard"], version = "*"}

[dependencies]
python = "3.10.*"
pip = "25.0.*"
cmake = "*"
ninja = "*"
gcc = "12.4.*"
gxx = "12.4.*"
cuda-toolkit = "12.4.*"
cuda-runtime = "12.4.*"
cuda-nvcc = "12.4.*"
cuda-nvtx = "12.4.*"
cudnn = "*"
libgl = "*"  

[tasks]
check-python = "python --version"
check-gpu = "python -c 'import torch; print(f\"CUDA available: {torch.cuda.is_available()}\\nGPU count: {torch.cuda.device_count()}\\nCurrent device: {torch.cuda.get_device_name()}\" if torch.cuda.is_available() else \"No CUDA GPU available\")'"
check-torch = "python -c 'import torch; print(f\"PyTorch version: {torch.__version__}\\nCUDA version: {torch.version.cuda}\")'"

# Copy custom code to GEN3C submodule
copy-custom = """
cp diffusion_only.py GEN3C/cosmos_predict1/diffusion/inference/ &&
cp create_rendering_image_input.py GEN3C/cosmos_predict1/diffusion/inference/ &&
cp camera_sequence_generation.py GEN3C/cosmos_predict1/diffusion/inference/ &&
cp generate_rendering_video.py GEN3C/cosmos_predict1/diffusion/inference/ &&
cp evaluate_video_quality.py GEN3C/cosmos_predict1/diffusion/inference/ &&
cp video_metrics.py GEN3C/cosmos_predict1/diffusion/inference/
"""

# Import GEN3C
import = "git submodule update --init --recursive GEN3C"

# Download GEN3C checkpoints
download-gen3c-checkpoints = """
bash -c '
set -euo pipefail
PY="$(command -v python)"
PIXI_ENV_PATH="$("$PY" -c "import sys; print(sys.prefix)")"
TOKEN="${1:-${HF_TOKEN:-}}"
DIR="${2:-checkpoints}"
[ -n "$TOKEN" ] || { echo "Usage: pixi run download-checkpoints -- <HF_TOKEN> [checkpoint_dir]"; exit 1; }
export HF_TOKEN="$TOKEN"
"$PY" - <<PY
from huggingface_hub import login
import os
login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)
PY
cd GEN3C
CUDA_HOME="$PIXI_ENV_PATH" PYTHONPATH="$(pwd)" "$PY" scripts/download_gen3c_checkpoints.py --checkpoint_dir "$DIR"
'
"""

import-dav2 = "git submodule update --init --recursive Depth-Estimation/Depth-Anything-V2"

download-dav2-checkpoints = "mkdir -p Depth-Estimation/Depth-Anything-V2/checkpoints/ && wget https://huggingface.co/depth-anything/Depth-Anything-V2-Metric-Hypersim-Large/resolve/main/depth_anything_v2_metric_hypersim_vitl.pth -P Depth-Estimation/Depth-Anything-V2/checkpoints/"

install-transformer-engine = """
python -m pip install 'transformer-engine[pytorch]==1.12.0'
"""

install-apex = """
bash -c '
set -euo pipefail
PY="$(command -v python)"
PIXI_ENV_PATH="$("$PY" -c "import sys; print(sys.prefix)")"
"$PY" -m pip install -U pip setuptools wheel packaging
mkdir -p "$PIXI_ENV_PATH/include" "$PIXI_ENV_PATH/include/python3.10"
ln -sf "$PIXI_ENV_PATH"/lib/python3.10/site-packages/nvidia/*/include/* "$PIXI_ENV_PATH/include/" || true
ln -sf "$PIXI_ENV_PATH"/lib/python3.10/site-packages/nvidia/*/include/* "$PIXI_ENV_PATH/include/python3.10/" || true
rm -rf apex
git clone --depth 1 https://github.com/NVIDIA/apex
CUDA_HOME="$PIXI_ENV_PATH" "$PY" -m pip install -v --disable-pip-version-check --no-cache-dir --no-build-isolation \
  --config-settings "--build-option=--cpp_ext" \
  --config-settings "--build-option=--cuda_ext" \
  ./apex
rm -rf apex
'
"""

install-moge = """
python -m pip install --no-deps git+https://github.com/microsoft/MoGe.git
"""

install-all-deps = """
pixi run install-transformer-engine && \
pixi run install-apex && \
pixi run install-moge
"""

predict-dense-depth = """
bash -c '
set -euo pipefail
PY="$(command -v python)"
PYTHONDONTWRITEBYTECODE=1 "$PY" predict_dense_depth.py "$@"
'
"""

